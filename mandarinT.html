<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>中英翻译 · Mandarin Translator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@300;400&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg: #0f1318;
    --panel-zh: #0d1f2d;
    --panel-en: #1a1008;
    --accent-zh: #2196f3;
    --accent-zh-light: #64b5f6;
    --accent-en: #c0392b;
    --accent-en-light: #e57368;
    --text: #f0ece4;
    --muted: #7a8a96;
    --divider: rgba(255,255,255,0.07);
    --card-bg: rgba(255,255,255,0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    font-family: 'Lora', serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── Layout: two halves ── */
  .half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 20px 20px 16px;
    position: relative;
    overflow: hidden;
    transition: background 0.4s ease;
  }

  .half.zh {
    background: var(--panel-zh);
    border-bottom: 1px solid var(--divider);
  }

  .half.en {
    background: var(--panel-en);
  }

  .half.zh.active { background: #0a1f35; }
  .half.en.active { background: #1f0d06; }

  /* Subtle glow when active */
  .half.zh.active::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(33,150,243,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  .half.en.active::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(192,57,43,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Middle divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .divider-label {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.25);
    text-transform: uppercase;
    white-space: nowrap;
    font-family: 'Lora', serif;
    font-style: italic;
  }

  /* ── Listen button (top = ZH, bottom = EN) ── */
  .listen-btn {
    width: 100%;
    max-width: 320px;
    border: none;
    border-radius: 40px;
    padding: 14px 24px;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Lora', serif;
    letter-spacing: 0.05em;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
  }

  .listen-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .half.zh .listen-btn {
    background: linear-gradient(135deg, rgba(33,150,243,0.2), rgba(33,150,243,0.1));
    border: 1.5px solid rgba(33,150,243,0.4);
    color: var(--accent-zh-light);
  }

  .half.zh .listen-btn:hover,
  .half.zh .listen-btn.listening {
    background: linear-gradient(135deg, rgba(33,150,243,0.35), rgba(33,150,243,0.2));
    border-color: var(--accent-zh);
    box-shadow: 0 0 20px rgba(33,150,243,0.25);
  }

  .half.en .listen-btn {
    background: linear-gradient(135deg, rgba(192,57,43,0.2), rgba(192,57,43,0.1));
    border: 1.5px solid rgba(192,57,43,0.4);
    color: var(--accent-en-light);
  }

  .half.en .listen-btn:hover,
  .half.en .listen-btn.listening {
    background: linear-gradient(135deg, rgba(192,57,43,0.35), rgba(192,57,43,0.2));
    border-color: var(--accent-en);
    box-shadow: 0 0 20px rgba(192,57,43,0.25);
  }

  .listen-btn .mic-icon {
    width: 20px; height: 20px;
    fill: currentColor;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .listen-btn.listening .mic-icon {
    animation: micPulse 1s ease-in-out infinite;
  }

  @keyframes micPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.2); opacity: 0.7; }
  }

  .btn-label { flex: 1; text-align: center; }
  .btn-lang { font-size: 0.7rem; opacity: 0.6; display: block; margin-top: 2px; font-style: italic; }

  /* Pulse ring on listening */
  .listen-btn.listening::after {
    opacity: 1;
    animation: btnRipple 1.4s ease-out infinite;
  }

  .half.zh .listen-btn.listening::after { box-shadow: 0 0 0 8px rgba(33,150,243,0.15); }
  .half.en .listen-btn.listening::after { box-shadow: 0 0 0 8px rgba(192,57,43,0.15); }

  @keyframes btnRipple {
    0% { box-shadow: 0 0 0 0 rgba(33,150,243,0.3); }
    100% { box-shadow: 0 0 0 16px rgba(33,150,243,0); }
  }

  /* ── Result card ── */
  .result-area {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 4px 0;
  }

  .result-card {
    width: 100%;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 14px 16px;
    display: none;
    flex-direction: column;
    gap: 8px;
    animation: fadeIn 0.35s ease forwards;
  }

  .result-card.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Original (what was heard) */
  .original-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.35;
    font-family: 'Lora', serif;
  }

  .original-text {
    font-size: 0.88rem;
    opacity: 0.55;
    font-style: italic;
    line-height: 1.5;
  }

  .half.zh .original-text {
    font-family: 'Noto Serif SC', serif;
    font-style: normal;
    letter-spacing: 0.05em;
  }

  /* Translation (output) */
  .translation-label {
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.35;
    font-family: 'Lora', serif;
    margin-top: 6px;
  }

  .translation-text {
    font-size: 1.2rem;
    line-height: 1.55;
    color: var(--text);
    font-weight: 600;
  }

  .half.zh .translation-text {
    /* ZH panel shows English translation */
    font-family: 'Lora', serif;
    font-size: 1.1rem;
    font-weight: 400;
  }

  .half.en .translation-text {
    /* EN panel shows Chinese translation */
    font-family: 'Noto Serif SC', serif;
    font-size: 1.3rem;
    letter-spacing: 0.05em;
  }

  .pinyin-text {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 0.8rem;
    color: var(--accent-zh-light);
    opacity: 0.75;
  }

  .meaning-note {
    font-size: 0.75rem;
    font-style: italic;
    opacity: 0.5;
    line-height: 1.5;
    border-top: 1px solid var(--divider);
    padding-top: 8px;
    margin-top: 2px;
  }

  /* Replay button */
  .replay-btn {
    align-self: flex-start;
    background: none;
    border: 1px solid rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.45);
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 0.68rem;
    cursor: pointer;
    font-family: 'Lora', serif;
    font-style: italic;
    letter-spacing: 0.06em;
    transition: all 0.2s;
    margin-top: 2px;
  }
  .replay-btn:hover { border-color: rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); }

  /* Status / placeholder */
  .status-text {
    font-size: 0.75rem;
    font-style: italic;
    opacity: 0.28;
    text-align: center;
    font-family: 'Lora', serif;
    letter-spacing: 0.05em;
  }

  /* Text input fallback */
  .text-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 320px;
    flex-shrink: 0;
  }

  .text-row input {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 7px 13px;
    color: var(--text);
    font-size: 0.82rem;
    font-family: 'Lora', serif;
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }
  .text-row input:focus { border-color: rgba(255,255,255,0.28); }
  .text-row input::placeholder { font-style: italic; opacity: 0.3; font-size: 0.75rem; }

  .text-send {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .half.zh .text-send { background: rgba(33,150,243,0.2); color: var(--accent-zh-light); }
  .half.en .text-send { background: rgba(192,57,43,0.2); color: var(--accent-en-light); }
  .text-send:hover { opacity: 0.8; }
  .text-send svg { width: 14px; height: 14px; fill: currentColor; }

  /* Speaking wave */
  .wave-row {
    display: flex;
    gap: 3px;
    align-items: center;
    height: 18px;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .wave-row.active { opacity: 1; }
  .wave-bar { width: 3px; border-radius: 2px; animation: wave 0.8s ease-in-out infinite; }
  .half.zh .wave-bar { background: var(--accent-zh-light); }
  .half.en .wave-bar { background: var(--accent-en-light); }
  .wave-bar:nth-child(1) { height: 6px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 12px; animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { height: 8px; animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { height: 14px; animation-delay: 0.15s; }
  .wave-bar:nth-child(5) { height: 6px; animation-delay: 0.05s; }

  @keyframes wave {
    0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(30,20,10,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 0.75rem;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    text-align: center;
    max-width: 300px;
    font-family: 'Lora', serif;
    font-style: italic;
  }
  .toast.show { opacity: 1; }

  /* Setup overlay */
  .setup-overlay {
    position: fixed; inset: 0;
    background: rgba(8,10,14,0.97);
    z-index: 300;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .setup-card {
    background: rgba(20,25,32,0.95);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px;
    padding: 34px 26px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }

  .setup-card .icon {
    font-size: 2.8rem;
    margin-bottom: 14px;
    display: block;
  }

  .setup-card h3 {
    font-family: 'Noto Serif SC', serif;
    font-size: 1.3rem;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: 0.05em;
  }

  .setup-card .sub {
    font-size: 0.78rem;
    font-style: italic;
    color: var(--muted);
    margin-bottom: 18px;
  }

  .setup-card p {
    font-size: 0.74rem;
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.65;
  }

  .setup-card input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: monospace;
    outline: none;
    margin-bottom: 12px;
  }
  .setup-card input:focus { border-color: rgba(33,150,243,0.5); }

  .setup-btn {
    width: 100%;
    background: linear-gradient(135deg, rgba(33,150,243,0.8), rgba(20,100,180,0.9));
    border: none;
    border-radius: 6px;
    color: white;
    padding: 12px;
    font-size: 0.9rem;
    cursor: pointer;
    font-family: 'Lora', serif;
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
  }
  .setup-btn:hover { opacity: 0.9; }

  .setup-note {
    font-size: 0.63rem;
    color: rgba(122,138,150,0.45);
    margin-top: 10px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <span class="icon">🀄</span>
    <h3>中英翻译</h3>
    <div class="sub">Mandarin ↔ English Translator</div>
    <p>Enter your Anthropic API key to begin. It stays in your browser only and is never stored externally.</p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off" />
    <button class="setup-btn" onclick="startApp()">开始 · Begin</button>
    <p class="setup-note">Need a key? Visit console.anthropic.com</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- TOP HALF: Mandarin → English -->
<div class="half zh" id="halfZH">

  <!-- Listen button at TOP -->
  <button class="listen-btn" id="btnZH" onclick="toggleListen('zh')">
    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-1 16.93A8.001 8.001 0 0 1 4 12H6a6 6 0 0 0 12 0h2a8.001 8.001 0 0 1-7 7.93V22h2v2H9v-2h2v-1.07z"/></svg>
    <span class="btn-label">
      听普通话
      <span class="btn-lang">Tap to speak Mandarin → hear English</span>
    </span>
  </button>

  <!-- Result area -->
  <div class="result-area">
    <div class="status-text" id="statusZH">Speak Mandarin above</div>
    <div class="result-card" id="cardZH">
      <div class="original-label">您说的 · You said</div>
      <div class="original-text" id="origZH"></div>
      <div class="translation-label">English meaning</div>
      <div class="translation-text" id="transZH"></div>
      <div class="meaning-note" id="noteZH"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <button class="replay-btn" id="replayZH" onclick="replaySpeech('zh')">🔊 Replay</button>
        <div class="wave-row" id="waveZH">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Text input fallback -->
  <div class="text-row">
    <input type="text" id="textZH" placeholder="Or type Mandarin here…" />
    <button class="text-send" onclick="submitText('zh')" title="Translate">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<div class="divider">
  <span class="divider-label">中文 ↔ English</span>
</div>

<!-- BOTTOM HALF: English → Mandarin -->
<div class="half en" id="halfEN">

  <!-- Result area -->
  <div class="result-area">
    <div class="status-text" id="statusEN">Speak English below</div>
    <div class="result-card" id="cardEN">
      <div class="original-label">You said</div>
      <div class="original-text" id="origEN"></div>
      <div class="translation-label">普通话 · Mandarin</div>
      <div class="translation-text" id="transEN"></div>
      <div class="pinyin-text" id="pinyinEN"></div>
      <div class="meaning-note" id="noteEN"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:4px">
        <button class="replay-btn" id="replayEN" onclick="replaySpeech('en')">🔊 重播</button>
        <div class="wave-row" id="waveEN">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Text input fallback -->
  <div class="text-row">
    <input type="text" id="textEN" placeholder="Or type English here…" />
    <button class="text-send" onclick="submitText('en')" title="Translate">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <!-- Listen button at BOTTOM -->
  <button class="listen-btn" id="btnEN" onclick="toggleListen('en')">
    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-1 16.93A8.001 8.001 0 0 1 4 12H6a6 6 0 0 0 12 0h2a8.001 8.001 0 0 1-7 7.93V22h2v2H9v-2h2v-1.07z"/></svg>
    <span class="btn-label">
      Listen for English
      <span class="btn-lang">Tap to speak English → hear Mandarin</span>
    </span>
  </button>

</div>

<script>
let apiKey = '';
let recognition = null;
let isListening = false;
let activePanel = null; // 'zh' or 'en'
let isBusy = false;
let lastSpeech = { zh: '', en: '' };

const SYSTEM_PROMPT = `You are a professional Mandarin-English translator with deep knowledge of Chinese idioms, proverbs, and cultural expressions.

When given Mandarin input, translate it to English — conveying the TRUE MEANING, not a word-for-word literal translation. For idioms and proverbs, explain the meaning they convey in natural English. For example, "癞蛤蟆想吃天鹅肉" should not be translated literally but as its meaning: "someone with unrealistic ambitions punching far above their weight."

When given English input, translate it to natural Mandarin Chinese — use idiomatic Chinese where appropriate.

ALWAYS respond with ONLY a valid JSON object (no markdown, no code blocks):

For Mandarin → English:
{
  "direction": "zh-en",
  "original": "the original Mandarin text exactly as given",
  "translation": "The natural English meaning or equivalent",
  "note": "Only if there is cultural context, an idiom explanation, or a literal vs meaning difference worth noting — otherwise empty string"
}

For English → Mandarin:
{
  "direction": "en-zh",
  "original": "the original English text exactly as given",
  "translation": "The Mandarin Chinese translation in characters",
  "pinyin": "Full pinyin with tone marks for the Mandarin translation",
  "note": "Only if there is a cultural nuance or usage note worth mentioning — otherwise empty string"
}

Detect the input language automatically. If the input is clearly Mandarin (Chinese characters or pinyin), output zh-en format. If the input is English, output en-zh format. Keep translations natural and fluent — never robotic.`;

function startApp() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-ant')) {
    showToast('Please enter a valid Anthropic API key (starts with sk-ant)');
    return;
  }
  apiKey = key;
  document.getElementById('setupOverlay').style.display = 'none';
  initRecognition();
}

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('Speech recognition not supported — please use the text boxes below.');
    document.getElementById('btnZH').style.opacity = '0.4';
    document.getElementById('btnEN').style.opacity = '0.4';
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let gotResult = false;

  recognition.onstart = () => {
    isListening = true;
    gotResult = false;
    document.getElementById('btn' + activePanel.toUpperCase()).classList.add('listening');
    document.getElementById('half' + activePanel.toUpperCase()).classList.add('active');
    setStatus(activePanel, activePanel === 'zh' ? '正在听… Listening…' : 'Listening…');
  };

  recognition.onresult = (e) => {
    gotResult = true;
    const text = e.results[0][0].transcript;
    stopListening();
    translate(activePanel, text);
  };

  recognition.onerror = (e) => {
    stopListening();
    if (e.error === 'not-allowed') {
      showToast('Microphone access denied. Please allow it in your browser settings.');
    } else if (e.error === 'no-speech') {
      setStatus(activePanel, 'No speech detected — try again or type below');
    } else {
      setStatus(activePanel, 'Speech error — please type below instead');
    }
    isBusy = false;
  };

  recognition.onend = () => {
    if (isListening) {
      stopListening();
      if (!gotResult) {
        const panel = activePanel || 'zh';
        setStatus(panel, 'Nothing captured — try typing below');
        isBusy = false;
      }
    }
  };
}

function toggleListen(panel) {
  // Stop TTS if playing
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
  }

  if (isBusy) return;

  if (isListening && activePanel === panel) {
    recognition.stop();
    stopListening();
    return;
  }

  if (!recognition) { initRecognition(); if (!recognition) return; }

  activePanel = panel;
  recognition.lang = panel === 'zh' ? 'zh-CN' : 'en-US';
  try {
    recognition.start();
    isBusy = true;
  } catch(e) {}
}

function stopListening() {
  isListening = false;
  const panel = activePanel || 'zh';
  const btn = document.getElementById('btn' + panel.toUpperCase());
  const half = document.getElementById('half' + panel.toUpperCase());
  if (btn) btn.classList.remove('listening');
  if (half) half.classList.remove('active');
}

function submitText(panel) {
  const input = document.getElementById('text' + panel.toUpperCase());
  const text = input.value.trim();
  if (!text || isBusy) return;
  input.value = '';
  translate(panel, text);
}

async function translate(panel, text) {
  if (!text) return;
  isBusy = true;

  // Show original in UI immediately
  document.getElementById('orig' + panel.toUpperCase()).textContent = text;
  document.getElementById('trans' + panel.toUpperCase()).textContent = '';
  document.getElementById('note' + panel.toUpperCase()).textContent = '';
  if (panel === 'en') document.getElementById('pinyinEN').textContent = '';
  document.getElementById('card' + panel.toUpperCase()).classList.add('visible');
  setStatus(panel, panel === 'zh' ? '翻译中… Translating…' : 'Translating…');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: text }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'API error');
    }

    const data = await response.json();
    const raw = data.content[0].text.trim();
    let parsed;
    try {
      parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    } catch(e) {
      throw new Error('Could not parse response');
    }

    // Fill results
    document.getElementById('trans' + panel.toUpperCase()).textContent = parsed.translation || '';
    document.getElementById('note' + panel.toUpperCase()).textContent = parsed.note || '';
    document.getElementById('note' + panel.toUpperCase()).style.display = parsed.note ? 'block' : 'none';

    if (panel === 'en' && parsed.pinyin) {
      document.getElementById('pinyinEN').textContent = parsed.pinyin;
    }

    setStatus(panel, '');

    // Auto-speak the translation
    const toSpeak = parsed.translation || '';
    lastSpeech[panel] = toSpeak;
    const lang = panel === 'zh' ? 'en-US' : 'zh-CN';
    speak(toSpeak, lang, panel);

  } catch(err) {
    setStatus(panel, 'Error — please try again');
    showToast(err.message || 'Something went wrong');
    isBusy = false;
  }
}

function speak(text, lang, panel) {
  if (!text) { isBusy = false; return; }
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = lang === 'zh-CN' ? 0.88 : 0.95;

  const voices = window.speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang === lang) ||
                voices.find(v => v.lang.startsWith(lang.split('-')[0]));
  if (voice) utter.voice = voice;

  const wave = document.getElementById('wave' + panel.toUpperCase());

  utter.onstart = () => { if (wave) wave.classList.add('active'); };
  utter.onend = utter.onerror = () => {
    if (wave) wave.classList.remove('active');
    isBusy = false;
  };

  if (voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = () => {
      const v2 = window.speechSynthesis.getVoices();
      const v = v2.find(x => x.lang === lang) || v2.find(x => x.lang.startsWith(lang.split('-')[0]));
      if (v) utter.voice = v;
      window.speechSynthesis.speak(utter);
    };
  } else {
    window.speechSynthesis.speak(utter);
  }
}

function replaySpeech(panel) {
  const text = lastSpeech[panel];
  if (!text) return;
  const lang = panel === 'zh' ? 'en-US' : 'zh-CN';
  speak(text, lang, panel);
}

function setStatus(panel, msg) {
  const el = document.getElementById('status' + panel.toUpperCase());
  if (el) el.textContent = msg;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

// Enter key for text inputs
document.getElementById('apiKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') startApp(); });
document.getElementById('textZH').addEventListener('keydown', e => { if (e.key === 'Enter') submitText('zh'); });
document.getElementById('textEN').addEventListener('keydown', e => { if (e.key === 'Enter') submitText('en'); });

// Preload voices
window.speechSynthesis.getVoices();
</script>
