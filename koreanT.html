<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>한영번역 · Korean Translator</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

  :root {
    --bg: #0e1016;
    --panel-ko: #121820;
    --panel-en: #141010;
    --accent-ko: #4f8ef7;
    --accent-ko-light: #82b0ff;
    --accent-en: #c0392b;
    --accent-en-light: #e57368;
    --text: #eeebe4;
    --muted: #7a8898;
    --divider: rgba(255,255,255,0.07);
    --card-bg: rgba(255,255,255,0.03);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: var(--bg);
    font-family: 'Lora', serif;
    color: var(--text);
    display: flex;
    flex-direction: column;
  }

  /* ── Two halves ── */
  .half {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 10px 20px 10px;   /* reduced top/bottom so button stays onscreen */
    position: relative;
    overflow: hidden;
    transition: background 0.4s ease;
    min-height: 0;
  }

  .half.ko { background: var(--panel-ko); border-bottom: 1px solid var(--divider); }
  .half.en { background: var(--panel-en); }

  .half.ko.active { background: #0c1828; }
  .half.en.active { background: #1f0c08; }

  .half.ko.active::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 100%, rgba(79,142,247,0.09) 0%, transparent 70%);
    pointer-events: none;
  }

  .half.en.active::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(192,57,43,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    flex-shrink: 0;
    position: relative;
    z-index: 10;
  }

  .divider-label {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: var(--bg);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 0.65rem;
    letter-spacing: 0.2em;
    color: rgba(255,255,255,0.22);
    text-transform: uppercase;
    white-space: nowrap;
    font-family: 'Lora', serif;
    font-style: italic;
  }

  /* ── Listen button ── */
  .listen-btn {
    width: 100%;
    max-width: 320px;
    border: none;
    border-radius: 40px;
    padding: 13px 22px;
    font-size: 0.95rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    font-family: 'Lora', serif;
    letter-spacing: 0.04em;
    transition: all 0.25s ease;
    position: relative;
    overflow: hidden;
    flex-shrink: 0;
    /* Keep button away from very edge */
    margin-top: 6px;
    margin-bottom: 6px;
  }

  /* KO button — at top of upper half */
  .half.ko .listen-btn { margin-top: 4px; }

  /* EN button — at bottom of lower half */
  .half.en .listen-btn { margin-bottom: 4px; }

  .half.ko .listen-btn {
    background: linear-gradient(135deg, rgba(79,142,247,0.18), rgba(79,142,247,0.08));
    border: 1.5px solid rgba(79,142,247,0.38);
    color: var(--accent-ko-light);
  }

  .half.ko .listen-btn:hover,
  .half.ko .listen-btn.listening {
    background: linear-gradient(135deg, rgba(79,142,247,0.32), rgba(79,142,247,0.18));
    border-color: var(--accent-ko);
    box-shadow: 0 0 22px rgba(79,142,247,0.22);
  }

  .half.en .listen-btn {
    background: linear-gradient(135deg, rgba(192,57,43,0.18), rgba(192,57,43,0.08));
    border: 1.5px solid rgba(192,57,43,0.38);
    color: var(--accent-en-light);
  }

  .half.en .listen-btn:hover,
  .half.en .listen-btn.listening {
    background: linear-gradient(135deg, rgba(192,57,43,0.32), rgba(192,57,43,0.18));
    border-color: var(--accent-en);
    box-shadow: 0 0 22px rgba(192,57,43,0.22);
  }

  .listen-btn .mic-icon {
    width: 19px; height: 19px;
    fill: currentColor;
    flex-shrink: 0;
    transition: transform 0.2s;
  }

  .listen-btn.listening .mic-icon {
    animation: micPulse 1s ease-in-out infinite;
  }

  @keyframes micPulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.25); opacity: 0.65; }
  }

  .btn-label { flex: 1; text-align: center; }
  .btn-lang { font-size: 0.68rem; opacity: 0.55; display: block; margin-top: 2px; font-style: italic; }

  /* Pulse ring */
  .listen-btn::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 40px;
    opacity: 0;
    pointer-events: none;
  }

  .half.ko .listen-btn.listening::after {
    opacity: 1;
    animation: rippleKO 1.4s ease-out infinite;
  }

  .half.en .listen-btn.listening::after {
    opacity: 1;
    animation: rippleEN 1.4s ease-out infinite;
  }

  @keyframes rippleKO {
    0% { box-shadow: 0 0 0 0 rgba(79,142,247,0.3); }
    100% { box-shadow: 0 0 0 14px rgba(79,142,247,0); }
  }

  @keyframes rippleEN {
    0% { box-shadow: 0 0 0 0 rgba(192,57,43,0.3); }
    100% { box-shadow: 0 0 0 14px rgba(192,57,43,0); }
  }

  /* ── Result area ── */
  .result-area {
    flex: 1;
    width: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 4px 0;
    min-height: 0;
    overflow: hidden;
  }

  .result-card {
    width: 100%;
    background: var(--card-bg);
    border-radius: 10px;
    padding: 12px 15px;
    display: none;
    flex-direction: column;
    gap: 7px;
    animation: fadeIn 0.3s ease forwards;
    overflow: hidden;
  }

  .result-card.visible { display: flex; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(5px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .original-label, .translation-label {
    font-size: 0.58rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.3;
    font-family: 'Lora', serif;
  }

  .original-text {
    font-size: 0.85rem;
    opacity: 0.5;
    font-style: italic;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .half.ko .original-text {
    font-family: 'Noto Sans KR', sans-serif;
    font-style: normal;
    letter-spacing: 0.02em;
  }

  .translation-label { margin-top: 5px; }

  .translation-text {
    font-size: 1.1rem;
    line-height: 1.5;
    color: var(--text);
    word-break: break-word;
  }

  /* KO panel shows English output */
  .half.ko .translation-text {
    font-family: 'Lora', serif;
    font-size: 1rem;
    font-weight: 400;
  }

  /* EN panel shows Korean output */
  .half.en .translation-text {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.15rem;
    font-weight: 600;
    letter-spacing: 0.02em;
  }

  .romanization-text {
    font-family: 'Lora', serif;
    font-style: italic;
    font-size: 0.78rem;
    color: var(--accent-ko-light);
    opacity: 0.72;
  }

  .meaning-note {
    font-size: 0.72rem;
    font-style: italic;
    opacity: 0.45;
    line-height: 1.5;
    border-top: 1px solid var(--divider);
    padding-top: 7px;
    margin-top: 2px;
    display: none;
  }

  .replay-btn {
    align-self: flex-start;
    background: none;
    border: 1px solid rgba(255,255,255,0.11);
    color: rgba(255,255,255,0.4);
    border-radius: 20px;
    padding: 3px 11px;
    font-size: 0.67rem;
    cursor: pointer;
    font-family: 'Lora', serif;
    font-style: italic;
    letter-spacing: 0.05em;
    transition: all 0.2s;
    margin-top: 2px;
  }
  .replay-btn:hover { border-color: rgba(255,255,255,0.28); color: rgba(255,255,255,0.65); }

  /* Status */
  .status-text {
    font-size: 0.73rem;
    font-style: italic;
    opacity: 0.25;
    text-align: center;
    font-family: 'Lora', serif;
    letter-spacing: 0.04em;
  }

  /* Text input row */
  .text-row {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 320px;
    flex-shrink: 0;
  }

  .text-row input {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 20px;
    padding: 7px 13px;
    color: var(--text);
    font-size: 0.82rem;
    font-family: 'Lora', serif;
    outline: none;
    transition: border-color 0.2s;
    min-width: 0;
  }
  .text-row input:focus { border-color: rgba(255,255,255,0.25); }
  .text-row input::placeholder { font-style: italic; opacity: 0.28; font-size: 0.73rem; }

  .text-send {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: opacity 0.2s;
  }
  .half.ko .text-send { background: rgba(79,142,247,0.18); color: var(--accent-ko-light); }
  .half.en .text-send { background: rgba(192,57,43,0.18); color: var(--accent-en-light); }
  .text-send:hover { opacity: 0.75; }
  .text-send svg { width: 13px; height: 13px; fill: currentColor; }

  /* Wave */
  .wave-row {
    display: flex; gap: 3px; align-items: center; height: 16px;
    opacity: 0; transition: opacity 0.2s;
  }
  .wave-row.active { opacity: 1; }
  .wave-bar { width: 3px; border-radius: 2px; animation: wave 0.8s ease-in-out infinite; }
  .half.ko .wave-bar { background: var(--accent-ko-light); }
  .half.en .wave-bar { background: var(--accent-en-light); }
  .wave-bar:nth-child(1) { height: 5px; animation-delay: 0s; }
  .wave-bar:nth-child(2) { height: 11px; animation-delay: 0.1s; }
  .wave-bar:nth-child(3) { height: 7px; animation-delay: 0.2s; }
  .wave-bar:nth-child(4) { height: 13px; animation-delay: 0.15s; }
  .wave-bar:nth-child(5) { height: 5px; animation-delay: 0.05s; }
  @keyframes wave {
    0%, 100% { transform: scaleY(0.5); opacity: 0.5; }
    50% { transform: scaleY(1); opacity: 1; }
  }

  /* Toast */
  .toast {
    position: fixed;
    top: 16px; left: 50%;
    transform: translateX(-50%);
    background: rgba(20,22,28,0.96);
    border: 1px solid rgba(255,255,255,0.1);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 20px;
    font-size: 0.74rem;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    text-align: center;
    max-width: 300px;
    font-family: 'Lora', serif;
    font-style: italic;
  }
  .toast.show { opacity: 1; }

  /* Setup overlay */
  .setup-overlay {
    position: fixed; inset: 0;
    background: rgba(6,8,12,0.97);
    z-index: 300;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }

  .setup-card {
    background: rgba(16,18,24,0.96);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
    padding: 32px 26px;
    max-width: 380px; width: 100%;
    text-align: center;
  }

  .setup-card .icon { font-size: 2.8rem; margin-bottom: 12px; display: block; }

  .setup-card h3 {
    font-family: 'Noto Serif KR', serif;
    font-size: 1.3rem;
    color: var(--text);
    margin-bottom: 4px;
    letter-spacing: 0.04em;
  }

  .setup-card .sub {
    font-size: 0.78rem; font-style: italic;
    color: var(--muted); margin-bottom: 16px;
  }

  .setup-card p {
    font-size: 0.73rem; color: var(--muted);
    margin-bottom: 16px; line-height: 1.65;
  }

  .setup-card input {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.11);
    border-radius: 6px;
    padding: 11px 14px;
    color: var(--text);
    font-size: 0.85rem;
    font-family: monospace;
    outline: none;
    margin-bottom: 12px;
  }
  .setup-card input:focus { border-color: rgba(79,142,247,0.5); }

  .setup-btn {
    width: 100%;
    background: linear-gradient(135deg, rgba(79,142,247,0.75), rgba(40,90,200,0.85));
    border: none; border-radius: 6px;
    color: white; padding: 12px;
    font-size: 0.9rem; cursor: pointer;
    font-family: 'Lora', serif;
    letter-spacing: 0.08em;
    transition: opacity 0.2s;
  }
  .setup-btn:hover { opacity: 0.88; }

  .setup-note {
    font-size: 0.62rem;
    color: rgba(120,136,150,0.4);
    margin-top: 10px; line-height: 1.5;
  }
</style>
</head>
<body>

<div class="setup-overlay" id="setupOverlay">
  <div class="setup-card">
    <span class="icon">🇰🇷</span>
    <h3>한영 번역기</h3>
    <div class="sub">Korean ↔ English Translator</div>
    <p>Enter your Anthropic API key to begin. It stays in your browser only and is never stored externally.</p>
    <input type="password" id="apiKeyInput" placeholder="sk-ant-api03-..." autocomplete="off" />
    <button class="setup-btn" onclick="startApp()">시작 · Begin</button>
    <p class="setup-note">Need a key? Visit console.anthropic.com</p>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- TOP HALF: Korean → English -->
<div class="half ko" id="halfKO">

  <!-- Listen button near top but with margin -->
  <button class="listen-btn" id="btnKO" onclick="toggleListen('ko')">
    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-1 16.93A8.001 8.001 0 0 1 4 12H6a6 6 0 0 0 12 0h2a8.001 8.001 0 0 1-7 7.93V22h2v2H9v-2h2v-1.07z"/></svg>
    <span class="btn-label">
      한국어 듣기
      <span class="btn-lang">Tap to speak Korean → hear English</span>
    </span>
  </button>

  <div class="result-area">
    <div class="status-text" id="statusKO">Speak Korean above</div>
    <div class="result-card" id="cardKO">
      <div class="original-label">말씀하신 내용 · You said</div>
      <div class="original-text" id="origKO"></div>
      <div class="translation-label">English meaning</div>
      <div class="translation-text" id="transKO"></div>
      <div class="meaning-note" id="noteKO"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:3px">
        <button class="replay-btn" id="replayKO" onclick="replaySpeech('ko')">🔊 Replay</button>
        <div class="wave-row" id="waveKO">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="text-row">
    <input type="text" id="textKO" placeholder="Or type Korean here…" />
    <button class="text-send" onclick="submitText('ko')">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

</div>

<div class="divider">
  <span class="divider-label">한국어 ↔ English</span>
</div>

<!-- BOTTOM HALF: English → Korean -->
<div class="half en" id="halfEN">

  <div class="result-area">
    <div class="status-text" id="statusEN">Speak English below</div>
    <div class="result-card" id="cardEN">
      <div class="original-label">You said</div>
      <div class="original-text" id="origEN"></div>
      <div class="translation-label">한국어 · Korean</div>
      <div class="translation-text" id="transEN"></div>
      <div class="romanization-text" id="romanEN"></div>
      <div class="meaning-note" id="noteEN"></div>
      <div style="display:flex;align-items:center;gap:10px;margin-top:3px">
        <button class="replay-btn" id="replayEN" onclick="replaySpeech('en')">🔊 다시 듣기</button>
        <div class="wave-row" id="waveEN">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="text-row">
    <input type="text" id="textEN" placeholder="Or type English here…" />
    <button class="text-send" onclick="submitText('en')">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>

  <!-- Listen button near bottom but with margin -->
  <button class="listen-btn" id="btnEN" onclick="toggleListen('en')">
    <svg class="mic-icon" viewBox="0 0 24 24"><path d="M12 1a4 4 0 0 1 4 4v6a4 4 0 0 1-8 0V5a4 4 0 0 1 4-4zm0 2a2 2 0 0 0-2 2v6a2 2 0 0 0 4 0V5a2 2 0 0 0-2-2zm-1 16.93A8.001 8.001 0 0 1 4 12H6a6 6 0 0 0 12 0h2a8.001 8.001 0 0 1-7 7.93V22h2v2H9v-2h2v-1.07z"/></svg>
    <span class="btn-label">
      Listen for English
      <span class="btn-lang">Tap to speak English → hear Korean</span>
    </span>
  </button>

</div>

<script>
let apiKey = '';
let recognition = null;
let isListening = false;
let activePanel = null;
let isBusy = false;
let lastSpeech = { ko: '', en: '' };

const SYSTEM_PROMPT = `You are a professional Korean-English translator with deep knowledge of Korean idioms, honorifics, proverbs, and cultural expressions.

When given Korean input, translate it to English — conveying the TRUE MEANING, not a word-for-word literal translation. For idioms and proverbs, explain the meaning they convey in natural English. For example, "원숭이도 나무에서 떨어진다" should be translated as its meaning: "Even experts make mistakes" not literally "Even monkeys fall from trees."

When given English input, translate it to natural Korean — use idiomatic, natural Korean appropriate to the context.

ALWAYS respond with ONLY a valid JSON object (no markdown, no code blocks):

For Korean → English:
{
  "direction": "ko-en",
  "original": "the original Korean text exactly as given",
  "translation": "The natural English meaning or equivalent",
  "note": "Only if there is cultural context, honorific nuance, an idiom explanation, or a literal vs meaning difference worth noting — otherwise empty string"
}

For English → Korean:
{
  "direction": "en-ko",
  "original": "the original English text exactly as given",
  "translation": "The Korean translation in Hangul characters",
  "romanization": "Romanization (Revised Romanization of Korean) so the user can pronounce it",
  "note": "Only if there is a cultural nuance, honorific level choice, or usage note worth mentioning — otherwise empty string"
}

Detect the input language automatically. If the input contains Korean (Hangul) characters, output ko-en format. If the input is English, output en-ko format. Keep translations natural and fluent — never robotic. Be aware of Korean speech levels (formal/informal) and default to polite formal (합쇼체) for English→Korean unless context suggests otherwise.`;

function startApp() {
  const key = document.getElementById('apiKeyInput').value.trim();
  if (!key.startsWith('sk-ant')) {
    showToast('Please enter a valid Anthropic API key (starts with sk-ant)');
    return;
  }
  apiKey = key;
  document.getElementById('setupOverlay').style.display = 'none';
  initRecognition();
}

function initRecognition() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    showToast('Speech recognition not supported — please use the text boxes below.');
    document.getElementById('btnKO').style.opacity = '0.4';
    document.getElementById('btnEN').style.opacity = '0.4';
    return;
  }
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  let gotResult = false;

  recognition.onstart = () => {
    isListening = true;
    gotResult = false;
    document.getElementById('btn' + activePanel.toUpperCase()).classList.add('listening');
    document.getElementById('half' + activePanel.toUpperCase()).classList.add('active');
    setStatus(activePanel, activePanel === 'ko' ? '듣고 있습니다… Listening…' : 'Listening…');
  };

  recognition.onresult = (e) => {
    gotResult = true;
    const text = e.results[0][0].transcript;
    stopListening();
    translate(activePanel, text);
  };

  recognition.onerror = (e) => {
    stopListening();
    if (e.error === 'not-allowed') {
      showToast('Microphone access denied. Please allow it in your browser settings.');
    } else if (e.error === 'no-speech') {
      setStatus(activePanel, 'No speech detected — try again or type below');
    } else {
      setStatus(activePanel, 'Speech error — please type below instead');
    }
    isBusy = false;
  };

  recognition.onend = () => {
    if (isListening) {
      stopListening();
      if (!gotResult) {
        const panel = activePanel || 'ko';
        setStatus(panel, 'Nothing captured — try typing below');
        isBusy = false;
      }
    }
  };
}

function toggleListen(panel) {
  if (window.speechSynthesis.speaking) window.speechSynthesis.cancel();
  if (isBusy) return;

  if (isListening && activePanel === panel) {
    recognition.stop();
    stopListening();
    return;
  }

  if (!recognition) { initRecognition(); if (!recognition) return; }

  activePanel = panel;
  recognition.lang = panel === 'ko' ? 'ko-KR' : 'en-US';
  try { recognition.start(); isBusy = true; } catch(e) {}
}

function stopListening() {
  isListening = false;
  const panel = activePanel || 'ko';
  const btn = document.getElementById('btn' + panel.toUpperCase());
  const half = document.getElementById('half' + panel.toUpperCase());
  if (btn) btn.classList.remove('listening');
  if (half) half.classList.remove('active');
}

function submitText(panel) {
  const input = document.getElementById('text' + panel.toUpperCase());
  const text = input.value.trim();
  if (!text || isBusy) return;
  input.value = '';
  translate(panel, text);
}

async function translate(panel, text) {
  if (!text) return;
  isBusy = true;

  document.getElementById('orig' + panel.toUpperCase()).textContent = text;
  document.getElementById('trans' + panel.toUpperCase()).textContent = '';
  document.getElementById('note' + panel.toUpperCase()).textContent = '';
  document.getElementById('note' + panel.toUpperCase()).style.display = 'none';
  if (panel === 'en') {
    document.getElementById('romanEN').textContent = '';
  }
  document.getElementById('card' + panel.toUpperCase()).classList.add('visible');
  setStatus(panel, panel === 'ko' ? '번역 중… Translating…' : 'Translating…');

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 600,
        system: SYSTEM_PROMPT,
        messages: [{ role: 'user', content: text }]
      })
    });

    if (!response.ok) {
      const err = await response.json();
      throw new Error(err.error?.message || 'API error');
    }

    const data = await response.json();
    const raw = data.content[0].text.trim();
    let parsed;
    try {
      parsed = JSON.parse(raw.replace(/```json|```/g, '').trim());
    } catch(e) {
      throw new Error('Could not parse response');
    }

    document.getElementById('trans' + panel.toUpperCase()).textContent = parsed.translation || '';

    if (parsed.note) {
      const noteEl = document.getElementById('note' + panel.toUpperCase());
      noteEl.textContent = parsed.note;
      noteEl.style.display = 'block';
    }

    if (panel === 'en' && parsed.romanization) {
      document.getElementById('romanEN').textContent = parsed.romanization;
    }

    setStatus(panel, '');

    const toSpeak = parsed.translation || '';
    lastSpeech[panel] = toSpeak;
    const lang = panel === 'ko' ? 'en-US' : 'ko-KR';
    speak(toSpeak, lang, panel);

  } catch(err) {
    setStatus(panel, 'Error — please try again');
    showToast(err.message || 'Something went wrong');
    isBusy = false;
  }
}

function speak(text, lang, panel) {
  if (!text) { isBusy = false; return; }
  window.speechSynthesis.cancel();

  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = lang;
  utter.rate = lang === 'ko-KR' ? 0.9 : 0.95;

  const doSpeak = () => {
    const voices = window.speechSynthesis.getVoices();
    const voice = voices.find(v => v.lang === lang) ||
                  voices.find(v => v.lang.startsWith(lang.split('-')[0]));
    if (voice) utter.voice = voice;
    window.speechSynthesis.speak(utter);
  };

  const wave = document.getElementById('wave' + panel.toUpperCase());
  utter.onstart = () => { if (wave) wave.classList.add('active'); };
  utter.onend = utter.onerror = () => {
    if (wave) wave.classList.remove('active');
    isBusy = false;
  };

  const voices = window.speechSynthesis.getVoices();
  if (voices.length === 0) {
    window.speechSynthesis.onvoiceschanged = doSpeak;
  } else {
    doSpeak();
  }
}

function replaySpeech(panel) {
  const text = lastSpeech[panel];
  if (!text) return;
  const lang = panel === 'ko' ? 'en-US' : 'ko-KR';
  speak(text, lang, panel);
}

function setStatus(panel, msg) {
  const el = document.getElementById('status' + panel.toUpperCase());
  if (el) el.textContent = msg;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}

document.getElementById('apiKeyInput').addEventListener('keydown', e => { if (e.key === 'Enter') startApp(); });
document.getElementById('textKO').addEventListener('keydown', e => { if (e.key === 'Enter') submitText('ko'); });
document.getElementById('textEN').addEventListener('keydown', e => { if (e.key === 'Enter') submitText('en'); });

window.speechSynthesis.getVoices();
</script>
